name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the sample engagements
        run: |
          PYTHONPATH=src python -m sox_itgc samples/granite_peak --out reports
          PYTHONPATH=src python -m sox_itgc samples/bluewater --out reports --fail-on-deficiency
